name: Build A36 Payload

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            git \
            wget \
            unzip \
            perl \
            python3

      - name: Download Android NDK r27c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r27c" >> $GITHUB_ENV

      - name: Build payload
        run: |
          make TARGET=a36xq-A366EXXSACZF2 \
            ANDROID_NDK_HOME=$ANDROID_NDK_ROOT release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a36xq-A366EXXSACZF2
          path: |
            out/**
            build/**
